<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0b3a63">
  <title>ورود به سامانه ارزیابی خودرو</title>
  <link rel="stylesheet" href="auth-pages.css?v=72">
</head>
<body data-auth-page="login">
  <main class="authPage">
    <section class="authCard" aria-labelledby="loginTitle">
      <button class="languageButton" id="languageButton" type="button">English</button>
      <img class="brandLogo" src="bamco-logo.png?v=72" alt="لوگوی خودروسازان بم">
      <div class="brandName" id="brandName">خودروسازان بم</div>
      <h1 id="loginTitle">سامانه ارزیابی خودرو</h1>
      <p class="intro" id="loginIntro">برای ورود، نام کاربری و رمز عبور را وارد کنید.</p>
      <form id="loginForm" autocomplete="on">
        <label><span id="usernameLabel">نام کاربری</span><input id="username" name="username" type="email" dir="ltr" autocomplete="username" placeholder="name@bamco.ir" required></label>
        <label><span id="passwordLabel">رمز عبور</span><input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" required></label>
        <div class="captchaBox">
          <div class="captchaRow">
            <input id="captchaAnswer" inputmode="numeric" autocomplete="off" aria-label="پاسخ کپچا" placeholder="پاسخ کپچا">
            <strong id="captchaQuestion" dir="ltr"></strong>
            <button id="captchaRefresh" class="captchaRefresh" type="button" aria-label="کپچای جدید">↻</button>
          </div>
          <small id="captchaMessage" aria-live="polite">پاسخ عبارت بالا را وارد کنید.</small>
        </div>
        <button id="loginButton" class="primaryButton" type="submit" disabled>ورود</button>
        <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="auth-pages.js?v=72"></script>
</body>
</html>
